# Rivo's execution plane on Render.
#
# The web app is deliberately NOT here. It belongs on Vercel: it is
# request-scoped, scales to zero, and must never be the thing running a trading
# loop. What this file deploys is the worker — the process that keeps managing
# portfolios after the browser closes.
#
#   render.com -> New -> Blueprint -> point at this repository
#
# Secrets are marked `sync: false`, so Render prompts for them and never reads
# them from the repository. Nothing sensitive is in this file and nothing should
# be added to it.

services:
  - type: worker
    name: rivo-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Same image as the CLI, pointed at a database. Two images would eventually
    # be two versions of the engine, and the difference would surface as a
    # portfolio behaving differently depending on which plane ran it.
    # One process, three jobs: the portfolio scheduler, and — guarded by a
    # Postgres advisory lock so exactly one worker in the fleet does it — the
    # shadow pass, settlement resolution and calibration refresh.
    #
    # The intelligence half is on by default in a long-lived worker and off for
    # `--once`, because a product whose claim is "every settled Event Contract
    # becomes new evidence" cannot depend on somebody keeping a terminal open.
    # `--no-intelligence` turns it off for a scheduler-only replica.
    dockerCommand: node_modules/.bin/tsx src/cli/worker.ts --interval 45 --concurrency 8
    # There is deliberately no healthCheckPath here.
    #
    # An earlier version had one, pointed at /ready, and the surrounding docs
    # claimed it was configured. Render supports healthCheckPath on WEB services
    # only; on a background worker the key is not honoured, so the setup that was
    # documented as detecting a stalled worker detected nothing.
    #
    # Making this a web service to get the check back would publish /health,
    # which reports lastError and the database host — nobody's business, and not
    # worth trading for a restart policy.
    #
    # Liveness is observed where it actually lives: every worker holds a database
    # lease, so a process that hangs stops renewing and disappears from
    # liveWorkers(). The web app's public /api/health reports that as
    # `workers: N`, which is platform-independent and true whether the worker
    # runs here, on Fly, or on a VPS. RIVO_ALERT_WEBHOOK below is what turns that
    # into something that reaches a person at 3am.
    envVars:
      - key: PORT
        value: 8080
      - key: NETWORK
        value: testnet
      # Pins the venue rather than relying on the built-in default, so a worker
      # and the web app cannot end up describing two different markets.
      - key: VENUE_ID
        sync: false
      # Session pooler, not the transaction pooler — see docs/DEPLOY.md §1.
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: no-verify
      # Without these every portfolio runs in Shadow Mode, which is the correct
      # way for a missing credential to fail.
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_AUTHORIZATION_KEY
        sync: false
      # Where to shout when a breaker fires. An unattended trader that halts at
      # 3am and tells nobody has done half its job.
      - key: RIVO_ALERT_WEBHOOK
        sync: false
      # Agent endpoints are called by this process. Private and link-local
      # addresses are refused unless a deployment says otherwise, which is right
      # on a developer's machine and wrong here — so it stays absent.
      - key: RIVO_ALLOW_PRIVATE_AGENTS
        value: "false"

