name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The suite is entirely offline: every venue interaction goes through a
      # fixture, so CI needs no key, no RPC and no funded wallet.
      - run: npm test
