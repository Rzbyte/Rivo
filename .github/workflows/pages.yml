name: Redirect the old Pages address

# rzbyte.github.io/Rivo used to serve a second, self-contained version of Rivo,
# built from src/public and deployed here on every push. It argued the portfolio
# case on its own terms and had its own identity, which was true when it was the
# only surface and became a contradiction the moment the product moved to
# intelligence and validation on Vercel.
#
# The last thing standing in the way of retiring it was that two studies — the
# live maker run and the cross-tenor coherence bound — appeared on NO other
# surface. They are on /evidence now, so this address has nothing left that is
# only here.
#
# It redirects rather than 404s. The README links it, and so may a submission, a
# message or a bookmark; disabling Pages breaks all of those, while one static
# file lands every one of them on the product.
#
# `npm run build:public` still works and still runs in CI. That bundle proves the
# pricing engine runs in a browser with no Node and no backend, which is a real
# property worth keeping tested — it is simply not a second product any more.

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No install and no build: one static file, which is the entire point.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
