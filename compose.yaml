# Rivo, self-hosted. `docker compose up -d` and open http://localhost:3000.
#
# The two services here are deliberately mutually exclusive, and only one starts
# by default. Both write the same state file, and two processes writing one
# portfolio is how a bot forgets a position it owns and buys a second copy — so
# `headless` sits behind a profile rather than being available by accident.
#
#   docker compose up -d                        cockpit; you press Start
#   docker compose --profile headless up -d     autopilot, no UI, restarts itself
#
# Neither trades until told to. Dry run is the default in the image, on the CLI,
# and here; `--live` is the only thing that changes it.

services:
  # The product surface: portfolio, live pricing, evidence, and the controls to
  # start and stop a run.
  cockpit:
    build: .
    image: rivo:latest
    command:
      - src/cli/web.ts
      - --host
      - 0.0.0.0
      - --data-dir
      - /app/data
    ports:
      # Bound to the loopback interface of the HOST, not to every interface.
      # Inside the container the server has to listen on 0.0.0.0 to be reachable
      # at all, and its own guard then demands RIVO_CONTROL_TOKEN for that — the
      # publish address is what keeps the port off the network regardless.
      - "127.0.0.1:3000:3000"
    environment:
      # Control endpoints can start live trading with the operator's key, so the
      # server refuses an off-loopback bind without a token. Set one in .env
      # beside this file; there is no default, on purpose.
      RIVO_CONTROL_TOKEN: ${RIVO_CONTROL_TOKEN:?set RIVO_CONTROL_TOKEN in .env — the cockpit can start live trading}
      NETWORK: ${NETWORK:-testnet}
    volumes:
      - state:/app/data
      # The agent wallet, read-only. The container can sign with it and cannot
      # alter it; `npm run agent -- sweep` on the host remains the way out.
      # The DIRECTORY is mounted rather than the file, so a clone that has not
      # run `npm run agent -- new` yet still starts — it simply finds no key and
      # stays in dry run, which is the right way for that to fail.
      #
      # The key is mode 600 on the host and the container runs as uid 1000
      # (`node`). That matches a default Linux desktop account, which is why this
      # works unchanged for most people. If your host uid differs, the container
      # reports no signing authority and stays dry rather than failing loudly —
      # so if Autopilot is unexpectedly unavailable, check this first:
      #   docker compose run --rm cockpit -e 'require("node:fs").readFileSync("/run/secrets/agent.key")'
      # Fix by adding `user: "${UID:-1000}:${GID:-1000}"` to this service.
      - ./.rivo:/run/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Unattended operation. Same image, no UI, and it comes back after a reboot.
  autopilot:
    profiles: ["headless"]
    build: .
    image: rivo:latest
    command:
      - src/cli/run.ts
      - --capital
      - ${RIVO_CAPITAL:-25}
      - --profile
      - ${RIVO_PROFILE:-balanced}
      - --data-dir
      - /app/data
      # Add --live here, or set it in your own override file, once you have
      # funded an agent wallet and read DISCLAIMER.md.
    environment:
      NETWORK: ${NETWORK:-testnet}
    volumes:
      - state:/app/data
      - ./.rivo:/run/secrets:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The multi-user platform. `docker compose --profile platform up -d`
  # ---------------------------------------------------------------------------
  #
  # A different product from the two services above, and kept behind its own
  # profile for the same reason they are kept apart from each other: it manages
  # MANY portfolios out of PostgreSQL rather than one out of a file, and running
  # both against the same wallet would be two runtimes on one account.
  #
  # The web app is not here. It belongs on Vercel — it is request-scoped, scales
  # to zero, and must never be the thing running a trading loop. For local
  # development run it directly: `npm run dev:web`.
  db:
    profiles: ["platform"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rivo
    ports:
      # Loopback only. A trading database on an open port is a bad afternoon.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivo -d rivo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The execution plane. Scale it with `--scale worker=3`: workers claim
  # portfolios with a database lease, so more of them is more throughput and
  # never two on one portfolio.
  worker:
    profiles: ["platform"]
    build: .
    image: rivo:latest
    command:
      - src/cli/worker.ts
      - --interval
      - ${RIVO_INTERVAL_SEC:-45}
      - --concurrency
      - ${RIVO_CONCURRENCY:-8}
    environment:
      DATABASE_URL: postgres://rivo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rivo
      # In-cluster, over a private network, with no TLS terminator in front of it.
      DATABASE_SSL: "off"
      NETWORK: ${NETWORK:-testnet}
      # Without these the worker runs every portfolio in Shadow Mode, which is
      # the correct way for a missing credential to fail.
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      PRIVY_AUTHORIZATION_KEY: ${PRIVY_AUTHORIZATION_KEY:-}
      RIVO_ALERT_WEBHOOK: ${RIVO_ALERT_WEBHOOK:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /ready, not /health: a worker that is up and has not completed a pass in
      # five minutes is not healthy in any sense a user would recognise.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # A named volume rather than a bind mount: the portfolio has to survive
  # `docker compose down`, and losing it means the runtime rebuilds its holdings
  # from the chain at the next reconcile — which works, but only for positions
  # the chain can still see.
  state:
  # The platform's durable state. Everything: users, portfolios, positions, the
  # execution ledger, the decision log.
  pgdata:
